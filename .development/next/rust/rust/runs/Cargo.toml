[package]
name = "nfqws2-runs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nfqws2-store = { path = "../store" }
nfqws2-config = { path = "../config" }
nfqws2-router-command = { path = "../router-command" }
nfqws2-dns = { path = "../dns" }
nfqws2-tls-roots = { path = "../tls-roots" }
tempfile = "3"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1"

[dev-dependencies]
rcgen = { version="0.14",default-features=false,features=["ring","crypto"] }
rustls = { version="0.23",default-features=false,features=["std","ring","tls12"] }
base64ct = { version="1",features=["alloc"] }
