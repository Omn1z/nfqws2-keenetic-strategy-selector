[package]
name = "nfqws2-blobs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nfqws2-tls-record = { path = "../tls-record" }
nfqws2-store = { path = "../store" }
serde.workspace = true
tempfile = "3"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", features = ["rust_backend"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
