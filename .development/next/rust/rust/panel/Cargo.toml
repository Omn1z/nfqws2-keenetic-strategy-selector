[package]
name = "nfqws2-strategy"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["embedded-geo", "embedded-runs", "embedded-strategies"]
embedded-strategies = ["dep:nfqws2-strategies"]
embedded-runs = ["dep:nfqws2-runs"]
embedded-geo = ["dep:nfqws2-geo"]
compact = []

[dependencies]
nfqws2-strategies = {path="../service-strategies", optional=true}
portable-atomic.workspace = true
nfqws2-awg-profile = { path = "../awg-profile" }
nfqws2-awg-rules = {path="../awg-rules"}
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "fs", "time", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
time = {version="0.3",features=["formatting","parsing"]}
zip = { version="9.1", default-features=false, features=["deflate-flate2"] }
nfqws2-monitor = { path = "../monitor" }
nfqws2-router-command = { path = "../router-command" }
nfqws2-config = { path = "../config" }
nfqws2-store = { path = "../store" }
nfqws2-runs = { path = "../runs", optional = true }
nfqws2-auth = { path = "../auth" }
nfqws2-blobs = { path = "../blobs" }
nfqws2-tgws-config = { path = "../tgws-config" }
nfqws2-tgws-transport = { path = "../tgws-transport" }
nfqws2-tls-roots = { path = "../tls-roots" }
nfqws2-backup = { path = "../backup" }
nfqws2-openwrt-dns = { path = "../openwrt-dns" }
nfqws2-dns = { path = "../dns" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring","tls12"] }
hyper = { version = "1", default-features = false, features = ["client","http1","http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
idna = "0.5"
sha2 = "0.11"
subtle = "2"
socket2 = "0.6"
httpdate = "1"
nfqws2-geo = { path = "../geo", optional = true }
tempfile = "3"
flate2 = "1"
libc = "0.2"
tar = { version = "0.4.46", default-features = false }

[build-dependencies]
flate2 = "1"
serde_json.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
